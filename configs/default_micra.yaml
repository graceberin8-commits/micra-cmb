# Default configuration for MICRA (Section 4.5 of the Manuscript)
model:
  name: "MICRA"
  k_neighbors: 1                     # k = 1 -> 3 adjacent slices (z-1, z, z+1)
  in_channels: 3                     # 2k + 1 slices
  r_max_mm: 5.0                      # Maximum physical CMB radius (10 mm diameter bound)
  reference_spacing_mm: [0.5, 0.5, 1.0]

  dinov3:
    arch: "vit_small_patch16"
    embed_dim: 384
    depth: 12
    num_heads: 6
    patch_size: 16
    freeze_backbone: true
    lora_rank: 8                     # Tuned over {4, 8, 16}
    lora_alpha: 16.0
    lora_last_n_blocks: 6            # LoRA on Q and V projections of last 6 blocks
    extract_layers: [3, 6, 9, 12]

  cnn_pathway:
    backbone: "resnet18"
    base_channels: 64
    scale_channels: [64, 128, 256, 512]
    enabled: true

  spacing_conditioning:
    mode: "spacing"                  # Options: "spacing", "cohort_id", "none"
    embed_dim: 128
    num_scales: 4
    unified_channels: 384

  scp_attention:
    enabled: true
    mode: "scp_full"                 # Options: "scp_full", "scp_bias_only", "learned_persistence", "similarity_only", "2d"
    num_heads: 6
    head_dim: 64                     # 6 * 64 = 384
    tau_p_mm: 1.5                    # Persistence sensitivity parameter tau_p (mm)
    lambda_p: 0.25                   # Persistence attention bias weight lambda_p
    sigma_min_mm: 0.5                # Multi-scale LoG minimum scale (mm)
    sigma_max_mm: 2.5                # Multi-scale LoG maximum scale (mm)
    delta_mm: 0.8                    # Scale step / bandwidth delta (mm)
    expose_sphericity_channel: true  # Concatenate S_z to decoder features

  mimic_learning:
    enabled: true
    beta_b: 0.4                      # Frangi vesselness beta_b parameter
    num_candidates: 21               # N_c = 21 candidate regions
    warmup_epochs: 10                # E_w = 10
    prototype_momentum: 0.1          # eta_c = 0.1
    gt_exclusion_mm: 2.0             # delta_g = 2.0 mm
    lambda_m: 1.0                    # Morphological similarity weight lambda_m
    mu: 0.5                          # Threshold / mixing factor mu
    memory_bank_size: 128            # K_h = 128
    num_positives_per_step: 8        # N_q = 8
    hard_negative_ratio: 0.5         # K_n = 0.5
    negative_sampling_ratio: 0.5     # N_r = 0.5
    tau_c: 0.5                       # Contrastive temperature tau_c = 0.5

augmentation:
  resolution_perturbation: true
  scale_range: [0.5, 2.0]            # s in [0.5, 2.0]
  vz_threshold_mm: 2.0               # v_z^thr = 2.0 mm
  max_perturbation_prob: 0.7         # m_max = 0.7

training:
  lr_lora: 1.0e-5
  lr_new_layers: 1.0e-4
  weight_decay: 1.0e-4
  grad_clip_norm: 1.0
  max_epochs: 100
  early_stopping_patience: 15
  batch_size: 1
  grad_accum_steps: 4
  mixed_precision: true
  lambda_bce: 0.05
  lambda_dice: 256.0
  lambda_proto: 8.0

evaluation:
  threshold: 0.5
  v_min: 50                          # Minimum volume threshold parameter V_min
  match_radius_mm: 5.0               # Center-distance matching threshold rho_m = 5 mm
  froc_fp_rates: [0.5, 1.0, 2.0, 4.0]
  bootstrap_resamples: 2000
  num_folds: 5
  seeds: [42, 123, 456]
